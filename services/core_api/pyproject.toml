[project]
name = "core-api"
version = "0.1.0"
description = "NightShift AI Core API — Sprint 1: Platform Foundation, OAuth Ingress, Baseline Store Ingestion"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
